name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-2022]
    steps:
      - uses: actions/checkout@v7
      - name: Normalize git line endings (Windows)
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run compile
      - run: npm test

  e2e:
    name: E2E (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-2022]
    steps:
      - uses: actions/checkout@v7
      - name: Normalize git line endings (Windows)
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Run integration tests
        if: runner.os != 'Linux'
        run: npm run test:integration
      - name: Run integration tests under Xvfb
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:integration
      - name: Run E2E tests
        if: runner.os != 'Linux'
        run: npm run test:e2e
      - name: Run E2E tests under Xvfb
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:e2e
      - name: Run packaged VSIX E2E under Xvfb
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:e2e:vsix
      - name: Upload E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-artifacts-${{ matrix.os }}
          path: artifacts/e2e
          if-no-files-found: ignore

  release:
    name: Release
    needs: [unit, e2e]
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Resolve merged release pull request
        id: release_pr
        uses: actions/github-script@v9
        with:
          script: |
            const repository = context.payload.repository;
            const pulls = await github.paginate(
              github.rest.repos.listPullRequestsAssociatedWithCommit,
              {
                ...context.repo,
                commit_sha: context.sha,
              },
            );
            const releasePull = pulls.find(({ merged_at, base, head }) => (
              merged_at !== null
              && base.ref === repository.default_branch
              && head.repo?.full_name === repository.full_name
              && head.ref.startsWith('release/')
            ));

            core.setOutput('eligible', releasePull !== undefined);
            if (releasePull) {
              core.notice(`Publishing merged release pull request #${releasePull.number}.`);
            } else {
              core.notice('No merged release/* pull request is associated with this commit; skipping publication.');
            }
      - uses: actions/checkout@v7
        if: steps.release_pr.outputs.eligible == 'true'
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        if: steps.release_pr.outputs.eligible == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: steps.release_pr.outputs.eligible == 'true'
        run: npm ci
      - name: Resolve version and tag state
        if: steps.release_pr.outputs.eligible == 'true'
        id: meta
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "vsix=look-git-$version.vsix" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Tag v$version already exists — skipping release."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Package VSIX
        if: steps.release_pr.outputs.eligible == 'true' && steps.meta.outputs.exists == 'false'
        run: npm run vsix -- release
      - name: Create tag and GitHub release
        if: steps.release_pr.outputs.eligible == 'true' && steps.meta.outputs.exists == 'false'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.meta.outputs.version }}
          name: v${{ steps.meta.outputs.version }}
          files: ${{ steps.meta.outputs.vsix }}
          fail_on_unmatched_files: true
          generate_release_notes: true
